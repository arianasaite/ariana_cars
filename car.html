<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>جزئیات خودرو | Ariana Cars</title>
<meta name="description" content="مشاهده جزئیات کامل خودروهای ایران خودرو، سایپا و... شامل قیمت به تفکیک سال، رنگ‌ها و مشخصات فنی.">
<meta name="google-site-verification" content="X-PsI39RMhgJ5R1p9vumr9sUwUoMO7BFMbKGJXVc204" />
<link rel="canonical" href="https://arianasaite.github.io/ariana_cars/car.html">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
    :root {
        --bg-main: #08060d;
        --bg-card-start: #14111e;
        --bg-card-end: #0a0812;
        --bg-card-hover: #1a1527;
        --bg-header: rgba(8, 6, 13, 0.88);
        --bg-subtle: rgba(201, 162, 39, 0.04);
        --text-primary: #f0e8d8;
        --text-secondary: #c8bfa8;
        --text-muted: #8a8070;
        --text-desc: #5a5550;
        --gold: #c9a227;
        --gold-light: #e8c766;
        --gold-dark: #8b6914;
        --green: #7fc99a;
        --border-gold: rgba(201, 162, 39, 0.25);
        --border-gold-strong: rgba(201, 162, 39, 0.5);
        --border-subtle: rgba(201, 162, 39, 0.1);
        --shadow-card: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(201, 162, 39, 0.05);
        --font-serif: 'Cormorant Garamond', 'Vazirmatn', Georgia, serif;
        --font-sans: 'Vazirmatn', Tahoma, sans-serif;
    }

    body.light {
        --bg-main: #f5eedb;
        --bg-card-start: #fdfaf0;
        --bg-card-end: #f5edd5;
        --bg-card-hover: #fffdf5;
        --bg-header: rgba(245, 238, 219, 0.92);
        --bg-subtle: rgba(139, 105, 20, 0.05);
        --text-primary: #1a1208;
        --text-secondary: #4a3d28;
        --text-muted: #7a6f5c;
        --text-desc: #a09880;
        --gold: #a67c1f;
        --gold-light: #c9a227;
        --gold-dark: #7a5a10;
        --green: #4a9d70;
        --border-gold: rgba(166, 124, 31, 0.3);
        --border-gold-strong: rgba(166, 124, 31, 0.55);
        --border-subtle: rgba(166, 124, 31, 0.12);
        --shadow-card: 0 10px 40px rgba(139, 105, 20, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
        font-family: var(--font-sans);
        background: var(--bg-main);
        color: var(--text-primary);
        direction: rtl;
        min-height: 100vh;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.5s ease, color 0.5s ease;
    }

    .app-container {
        max-width: 500px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg-main);
        box-shadow: 0 0 80px rgba(0,0,0,0.6);
        padding-bottom: 40px;
    }

    .app-header {
        position: sticky; top: 0; z-index: 50;
        background: var(--bg-header);
        backdrop-filter: blur(25px) saturate(150%);
        -webkit-backdrop-filter: blur(25px) saturate(150%);
        border-bottom: 1px solid var(--border-subtle);
        padding: 14px 20px;
        display: flex; align-items: center; justify-content: space-between;
    }
    .back-btn {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: var(--bg-subtle);
        border: 1px solid var(--border-gold);
        color: var(--gold);
        font-size: 20px;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.3s ease;
        text-decoration: none;
    }
    .back-btn:active { transform: scale(0.9); }
    .header-title {
        font-size: 15px;
        color: var(--gold);
        font-family: var(--font-serif);
        letter-spacing: 3px;
        font-weight: 400;
    }
    .header-spacer { width: 40px; }

    /* ==================== LOADING ==================== */
    .loading-container {
        padding: 80px 20px;
        text-align: center;
    }
    .spinner {
        width: 50px; height: 50px;
        border: 2px solid var(--border-gold);
        border-top-color: var(--gold);
        border-radius: 50%;
        margin: 0 auto 20px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-muted); font-size: 13px; letter-spacing: 1px; }

    /* ==================== CONTENT ==================== */
    .page-content { display: none; padding: 20px; }
    .page-content.active { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Hero */
    .car-hero { text-align: center; margin-bottom: 30px; }
    .car-hero-image {
        width: 100%;
        aspect-ratio: 16/10;
        border-radius: 12px;
        background: linear-gradient(135deg, #1a1527, #0d0a16);
        display: flex; align-items: center; justify-content: center;
        font-size: 100px;
        border: 1px solid var(--border-gold);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        position: relative;
        margin-bottom: 20px;
    }
    .car-hero-image img {
        width: 100%; height: 100%;
        object-fit: cover;
    }
    .car-hero-image::before, .car-hero-image::after {
        content: "";
        position: absolute;
        width: 20px; height: 20px;
        border: 1px solid var(--gold);
        opacity: 0.5;
    }
    .car-hero-image::before { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .car-hero-image::after { bottom: 8px; left: 8px; border-right: none; border-top: none; }

    .car-name {
        font-size: 26px;
        color: var(--gold);
        font-family: var(--font-serif);
        letter-spacing: 2px;
        font-weight: 500;
        margin-bottom: 6px;
    }
    .car-brand-line {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 18px;
    }

    .car-badges {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }
    .car-badge-item {
        padding: 5px 14px;
        background: var(--bg-subtle);
        border: 1px solid var(--border-gold);
        border-radius: 20px;
        font-size: 11px;
        color: var(--gold);
        letter-spacing: 1px;
    }

    /* Section */
    .detail-section { margin-bottom: 30px; }
    .detail-section-title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        color: var(--gold);
        font-family: var(--font-serif);
        letter-spacing: 1.5px;
        margin-bottom: 16px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-subtle);
    }
    .detail-section-title::before {
        content: "◆";
        color: var(--gold);
        font-size: 10px;
        opacity: 0.6;
    }

    /* Price cards */
    .current-price-card {
        background: linear-gradient(145deg, var(--bg-card-start), var(--bg-card-end));
        border: 1px solid var(--border-gold);
        border-radius: 12px;
        padding: 22px;
        text-align: center;
        margin-bottom: 16px;
        position: relative;
        box-shadow: var(--shadow-card);
    }
    .current-price-card::before, .current-price-card::after {
        content: "";
        position: absolute;
        width: 15px; height: 15px;
        border: 1px solid var(--gold);
        opacity: 0.5;
    }
    .current-price-card::before { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .current-price-card::after { bottom: 8px; left: 8px; border-right: none; border-top: none; }

    .price-label { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; }
    .price-value-main {
        font-size: 32px;
        color: var(--gold-light);
        font-family: var(--font-serif);
        direction: ltr;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .price-value-sub {
        font-size: 12px;
        color: var(--text-muted);
    }

    /* Price by year */
    .price-table {
        width: 100%;
        border-collapse: collapse;
        background: linear-gradient(145deg, var(--bg-card-start), var(--bg-card-end));
        border: 1px solid var(--border-gold);
        border-radius: 8px;
        overflow: hidden;
    }
    .price-table thead {
        background: var(--bg-subtle);
    }
    .price-table th, .price-table td {
        padding: 14px 16px;
        text-align: right;
        font-size: 13px;
        border-bottom: 1px solid var(--border-subtle);
    }
    .price-table tr:last-child td { border-bottom: none; }
    .price-table th {
        color: var(--gold);
        font-weight: 400;
        font-family: var(--font-serif);
        letter-spacing: 1px;
    }
    .price-table td { color: var(--text-primary); }
    .price-table td.price-value {
        color: var(--gold-light);
        font-family: var(--font-serif);
        direction: ltr;
        text-align: left;
        font-weight: 500;
    }

    /* Colors */
    .colors-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
    .color-item {
        display: flex;
        align-items: center;
        gap: 12px;
        background: linear-gradient(145deg, var(--bg-card-start), var(--bg-card-end));
        border: 1px solid var(--border-gold);
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        transition: all 0.3s ease;
    }
    .color-item:active { transform: scale(0.97); }
    .color-swatch {
        width: 26px; height: 26px;
        border-radius: 50%;
        border: 2px solid var(--border-gold-strong);
        flex-shrink: 0;
        box-shadow: inset 0 0 6px rgba(0,0,0,0.3);
    }
    .color-name { color: var(--text-secondary); }

    /* Specs */
    .specs-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }
    .spec-item {
        background: linear-gradient(145deg, var(--bg-card-start), var(--bg-card-end));
        border: 1px solid var(--border-gold);
        border-radius: 8px;
        padding: 14px;
    }
    .spec-label {
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }
    .spec-value {
        font-size: 14px;
        color: var(--text-primary);
        font-family: var(--font-serif);
        letter-spacing: 0.5px;
    }

    /* Global price */
    .global-price-box {
        background: linear-gradient(145deg, var(--bg-card-start), var(--bg-card-end));
        border: 1px solid var(--border-gold-strong);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        position: relative;
        box-shadow: 0 0 40px rgba(201, 162, 39, 0.1);
    }
    .global-price-box::before, .global-price-box::after {
        content: "";
        position: absolute;
        width: 20px; height: 20px;
        border: 1px solid var(--gold);
        opacity: 0.6;
    }
    .global-price-box::before { top: 10px; right: 10px; border-left: none; border-bottom: none; }
    .global-price-box::after { bottom: 10px; left: 10px; border-right: none; border-top: none; }
    .global-price-value {
        font-size: 34px;
        color: var(--gold-light);
        font-family: var(--font-serif);
        direction: ltr;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }
    .global-price-label { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; }

    /* Description */
    .description-text {
        background: var(--bg-subtle);
        border-right: 2px solid var(--gold);
        border-radius: 8px;
        padding: 16px 18px;
        font-size: 13px;
        line-height: 2;
        color: var(--text-secondary);
    }

    /* Footer */
    .footer-note {
        text-align: center;
        padding: 20px;
        font-size: 11px;
        color: var(--text-desc);
        letter-spacing: 2px;
        margin-top: 20px;
        border-top: 1px solid var(--border-subtle);
    }

    /* Not found */
    .not-found {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-muted);
    }
    .not-found-icon { font-size: 60px; margin-bottom: 20px; opacity: 0.4; }
    .not-found-title { font-size: 18px; color: var(--gold); font-family: var(--font-serif); margin-bottom: 10px; }
</style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <a href="index.html" class="back-btn">←</a>
        <div class="header-title">ARIANA</div>
        <div class="header-spacer"></div>
    </header>

    <!-- Loading -->
    <div class="loading-container" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">در حال بارگذاری اطلاعات...</div>
    </div>

    <!-- Content -->
    <div class="page-content" id="content"></div>

    <!-- Not Found -->
    <div class="not-found" id="notFound" style="display:none;">
        <div class="not-found-icon">🔍</div>
        <div class="not-found-title">خودرویی یافت نشد</div>
        <div style="font-size: 12px; margin-top: 10px;">لطفاً به صفحه اصلی برگردید</div>
    </div>
</div>

<script>
    // ==================== تشخیص خودرو از URL ====================
    function getIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }

    // ==================== بارگذاری ====================
    async function loadCar() {
        const id = getIdFromUrl();
        
        if (!id) {
            showNotFound();
            return;
        }

        try {
            const response = await fetch('data/cars-details.json?_=' + Date.now());
            if (!response.ok) throw new Error('JSON not found');
            const data = await response.json();

            const car = data.cars.find(c => c.id === id);
            if (!car) {
                showNotFound();
                return;
            }

            renderCar(car);
            document.title = `قیمت و مشخصات ${car.name} | Ariana Cars`;

        } catch (e) {
            console.error(e);
            showNotFound();
        }
    }

    function showNotFound() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('notFound').style.display = 'block';
    }

    function formatPrice(v) {
        if (!v) return '—';
        return Number(v).toLocaleString('fa-IR');
    }

    // ==================== رندر ====================
    function renderCar(car) {
        document.getElementById('loading').style.display = 'none';
        const content = document.getElementById('content');
        content.classList.add('active');

        // رنگ‌ها
        const colorsHTML = (car.colors || []).map(c => `
            <div class="color-item">
                <div class="color-swatch" style="background:${c.hex};"></div>
                <div class="color-name">${c.name}</div>
            </div>
        `).join('');

        // قیمت‌ها به تفکیک سال
        const pricesHTML = (car.pricesByYear || []).map(p => `
            <tr>
                <td>${p.year}</td>
                <td class="price-value">${formatPrice(p.price)} تومان</td>
            </tr>
        `).join('');

        // مشخصات فنی
        const specsHTML = Object.entries(car.specs || {}).map(([label, value]) => `
            <div class="spec-item">
                <div class="spec-label">${label}</div>
                <div class="spec-value">${value}</div>
            </div>
        `).join('');

        content.innerHTML = `
            <div class="car-hero">
                <div class="car-hero-image">
                    ${car.image ? `<img src="${car.image}" alt="${car.name}" onerror="this.style.display='none';this.parentElement.innerHTML='${car.icon}';">` : car.icon}
                </div>
                <div class="car-name">${car.name}</div>
                <div class="car-brand-line">${car.brandName} · ${car.type}</div>
                <div class="car-badges">
                    ${car.badges ? car.badges.map(b => `<div class="car-badge-item">${b}</div>`).join('') : ''}
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">💰 قیمت فعلی بازار</div>
                <div class="current-price-card">
                    <div class="price-label">قیمت بازار آزاد (مهر ۱۴۰۵)</div>
                    <div class="price-value-main">${formatPrice(car.marketPrice)}</div>
                    <div class="price-value-sub">تومان</div>
                </div>
                ${car.factoryPrice ? `
                <div class="current-price-card" style="padding: 16px;">
                    <div class="price-label">قیمت کارخانه</div>
                    <div class="price-value-main" style="font-size:22px; color:var(--green);">${formatPrice(car.factoryPrice)}</div>
                    <div class="price-value-sub">تومان</div>
                </div>
                ` : ''}
            </div>

            ${pricesHTML ? `
            <div class="detail-section">
                <div class="detail-section-title">📅 قیمت به تفکیک سال</div>
                <table class="price-table">
                    <thead>
                        <tr><th>سال</th><th style="text-align:left;">قیمت بازار</th></tr>
                    </thead>
                    <tbody>${pricesHTML}</tbody>
                </table>
            </div>
            ` : ''}

            ${colorsHTML ? `
            <div class="detail-section">
                <div class="detail-section-title">🎨 رنگ‌های موجود</div>
                <div class="colors-grid">${colorsHTML}</div>
            </div>
            ` : ''}

            ${specsHTML ? `
            <div class="detail-section">
                <div class="detail-section-title">⚙️ مشخصات فنی</div>
                <div class="specs-grid">${specsHTML}</div>
            </div>
            ` : ''}

            ${car.globalPriceUSD ? `
            <div class="detail-section">
                <div class="detail-section-title">🌍 قیمت جهانی</div>
                <div class="global-price-box">
                    <div class="global-price-value">$${car.globalPriceUSD.toLocaleString()}</div>
                    <div class="global-price-label">معادل دلاری قیمت بازار ایران (مهر ۱۴۰۵)</div>
                </div>
            </div>
            ` : ''}

            ${car.description ? `
            <div class="detail-section">
                <div class="detail-section-title">📝 توضیحات</div>
                <div class="description-text">${car.description}</div>
            </div>
            ` : ''}

            <div class="footer-note">◆ ARIANA CARS ◆</div>
        `;
    }

    // ==================== شروع ====================
    loadCar();
</script>

</body>
</html>
